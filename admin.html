<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Modifier les photos</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">Paul Excavation</a>
      <nav class="main-nav">
        <a href="index.html">Accueil</a>
        <a href="a-propos.html">À propos</a>
        <a href="projets.html">Projets</a>
        <a href="gallery.html">Galerie</a>
        <a href="contact.html">Contact</a>
        <a class="button button-secondary" href="admin.html">Admin</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section container">
      <h1>Admin : changer les photos</h1>
      <p>Cette page vous permet de mettre à jour les images affichées sur la page Galerie.</p>

      <form id="photo-form" class="admin-form">
        <div class="form-group">
          <label for="photo1">Photo 1 URL</label>
          <input id="photo1" type="url" placeholder="https://..." />
        </div>
        <div class="form-group">
          <label for="photo2">Photo 2 URL</label>
          <input id="photo2" type="url" placeholder="https://..." />
        </div>
        <div class="form-group">
          <label for="photo3">Photo 3 URL</label>
          <input id="photo3" type="url" placeholder="https://..." />
        </div>
        <div class="form-group">
          <label for="photo4">Photo 4 URL</label>
          <input id="photo4" type="url" placeholder="https://..." />
        </div>
        <button class="button" type="submit">Enregistrer les photos</button>
      </form>

      <section class="section preview-section">
        <h2>Aperçu des images</h2>
        <div id="preview-grid" class="gallery-grid"></div>
      </section>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>Paul Excavation &copy; 2026</p>
      <p>Retour à <a href="gallery.html">la galerie</a>.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
